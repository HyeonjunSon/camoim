# Login flow — signs in with email/password and confirms the tab navigation is reached
appId: com.hyeonjun122.cahanin
name: 01 Login
env:
  EMAIL: ${MAESTRO_EMAIL}
  PASSWORD: ${MAESTRO_PASSWORD}
tags:
  - smoke
---
- launchApp:
    clearState: true
    permissions:
      notifications: deny

# Wait for the app to reach the login screen (allowing for splash and font loading)
- extendedWaitUntil:
    visible:
      id: "login-email"
    timeout: 30000

- tapOn:
    id: "login-email"
- inputText: ${EMAIL}

- tapOn:
    id: "login-password"
- inputText: ${PASSWORD}

- hideKeyboard
- tapOn:
    id: "login-submit"

# A successful login lands on the bottom tab navigation
- extendedWaitUntil:
    visible:
      id: "tab-chat"
    timeout: 30000

- assertVisible:
    id: "tab-home"
