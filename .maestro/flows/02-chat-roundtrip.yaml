# Core flow E2E: log in, open a chat room, send a message, confirm it arrives
#
# How "arrival" is verified:
#   ChatRoomScreen.sendMessage() does no optimistic rendering. A bubble is drawn only
#   from the new_message event the server sends back over the socket.
#   So the sent text appearing in the thread means the whole round trip
#   app → WebSocket → Railway server → MongoDB write → broadcast → app
#   succeeded end to end.
appId: com.hyeonjun122.cahanin
name: 02 Chat send and receive round trip
env:
  EMAIL: ${MAESTRO_EMAIL}
  PASSWORD: ${MAESTRO_PASSWORD}
tags:
  - smoke
  - chat
---
- launchApp:
    clearState: true
    permissions:
      notifications: deny

# ── Log in ────────────────────────────────────────────────
- extendedWaitUntil:
    visible:
      id: "login-email"
    timeout: 30000
- tapOn:
    id: "login-email"
- inputText: ${EMAIL}
- tapOn:
    id: "login-password"
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-submit"

# ── Chat tab → the first chat room ────────────────────────
- extendedWaitUntil:
    visible:
      id: "tab-chat"
    timeout: 30000
- tapOn:
    id: "tab-chat"

- extendedWaitUntil:
    visible:
      id: "chat-room-card"
    timeout: 15000
- tapOn:
    id: "chat-room-card"
    index: 0

- extendedWaitUntil:
    visible:
      id: "chat-input"
    timeout: 15000

# ── Send ──────────────────────────────────────────────────
# A unique string per run, so it is never confused with a previous run's message
- evalScript: ${output.msg = 'maestro-e2e-' + Date.now()}
- tapOn:
    id: "chat-input"
- inputText: ${output.msg}
- tapOn:
    id: "chat-send"

# ── Confirm arrival ───────────────────────────────────────
# Passes only once the message the server echoed over the socket is drawn in the thread
- extendedWaitUntil:
    visible: ${output.msg}
    timeout: 15000

# Pin down that the bubble really rendered inside the list
- assertVisible:
    id: "chat-messages"
- assertVisible: ${output.msg}
