name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 같은 브랜치에 새 푸시가 오면 이전 실행 취소 (러너 시간 절약)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: 클라이언트 유닛 테스트 (Expo/RN)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      # patch-package(postinstall)가 patches/를 적용해야 하므로 ci 그대로 사용
      - name: 의존성 설치
        run: npm ci

      - name: Jest 실행
        run: npm test -- --ci --coverage

      - name: 커버리지 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-client
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  server:
    name: 서버 유닛·통합 테스트 (Express/Socket.io)
    runs-on: ubuntu-latest
    env:
      # mongodb-memory-server 바이너리 위치를 고정해서 캐시 키와 맞춘다
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: 의존성 설치
        working-directory: server
        run: npm ci

      # mongodb-memory-server가 받아오는 mongod 바이너리는 매 실행마다 받지 않도록 캐시
      - name: mongod 바이너리 캐시
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - name: Jest 실행
        working-directory: server
        run: npm test -- --ci --coverage

      - name: 커버리지 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-server
          path: server/coverage/
          retention-days: 7
          if-no-files-found: ignore
